# Cloud installation-post runner.
#
# Triggered by the phone Publish tap or by Square+photo auto-dispatch. Both
# send only an opaque job id and the approved revision. No installation facts,
# customer data, or credentials appear in the inputs or the logs — the runner
# fetches the approved envelope from a signed internal endpoint.
#
# This job holds the Webflow publishing token, so its supply chain is immutable:
# actions are pinned to commit SHAs (a tag can be moved) and dependencies are
# installed in pip's hash-checking mode.

name: Publish installation post

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque installation-post job id
        required: true
        type: string
      revision:
        description: Approved seed+photo revision hash
        required: true
        type: string
      dispatch_id:
        description: Publish lease dispatch id
        required: true
        type: string

# One in-flight run per approved revision. A duplicate dispatch for the same
# revision cannot run concurrently, on top of the Upstash publish lease.
concurrency:
  group: install-post-${{ inputs.job_id }}-${{ inputs.revision }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the dispatched revision of the runner
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install runner dependencies
        working-directory: cloud/install-post-runner
        run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Publish and verify
        working-directory: cloud/install-post-runner
        env:
          JOB_ID: ${{ inputs.job_id }}
          REVISION: ${{ inputs.revision }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          INSTALL_POST_API_BASE: ${{ vars.INSTALL_POST_API_BASE }}
          INSTALL_POST_RUNNER_SECRET: ${{ secrets.INSTALL_POST_RUNNER_SECRET }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python runner.py
